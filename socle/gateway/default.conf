# Passerelle : point d'entrée unique, distribue vers le front et les API.
# Indépendante du client et de la solution : en solution 2, le service api
# porte l'alias réseau api-common (cf. ADR 0011).
server {
    listen 8080;
    server_name _;

    # DNS interne de Docker, avec résolution à chaque requête (proxy_pass à
    # variable) : tolère le redémarrage d'un service et l'absence d'un nom au
    # démarrage de la passerelle.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Sonde de santé de la passerelle elle-même
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/common/ {
        set $upstream http://api-common:8000;
        proxy_pass $upstream;
    }

    # Autres chemins d'API : l'API du client (404 Laravel si la route lui est inconnue)
    location /api/ {
        set $upstream http://api:8000;
        proxy_pass $upstream;
    }

    location / {
        set $upstream http://front:8080;
        proxy_pass $upstream;
    }
}
