# Le front sert uniquement l'appli React : les appels d'API sont distribués
# en amont par la passerelle (socle/gateway, cf. ADR 0011).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Routage côté navigateur (react-router)
    location / {
        try_files $uri /index.html;
    }
}
