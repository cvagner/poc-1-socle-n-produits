# Composition de base, commune à tous les clients et aux deux solutions.
# À compléter par cliN/compose-cliN.yaml, plus socle/compose-standalone.yaml
# pour la solution 2. Les chemins relatifs sont résolus depuis socle/.
#   Solution 1 : COMPOSE_FILE=socle/compose.yaml:cli1/compose-cli1.yaml
#   Solution 2 : COMPOSE_FILE=socle/compose.yaml:cli1/compose-cli1.yaml:socle/compose-standalone.yaml
name: poc-1-socle-n-produits

x-api: &api
  user: "${APP_UID:-10001}:${APP_GID:-10001}"
  read_only: true
  tmpfs:
    - /tmp
    - /app/storage/framework/views:mode=1777
    - /app/storage/framework/cache:mode=1777
  deploy:
    resources:
      limits:
        cpus: "0.5"
        memory: 256M
  healthcheck:
    test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8000/up"]
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 10s

services:
  # Point d'entrée unique : distribue vers front, api-common et api (ADR 0011)
  gateway:
    image: nginxinc/nginx-unprivileged:1.30.5-alpine
    volumes:
      - ./gateway/default.conf:/etc/nginx/conf.d/default.conf:ro
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Sert uniquement l'appli React du client
  front:
    build:
      context: ./frontend
      # additional_contexts.client : fourni par cliN/compose-cliN.yaml
      args:
        # Empreinte des sources du client, calculée par le Makefile : sans
        # elle, le cache de Compose ignore les modifications du client.
        CLIENT_REV: ${CLIENT_REV:-}
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # API du tronc commun (solution 1 uniquement)
  api-common:
    <<: *api
    build:
      context: ./backend
      args:
        COMMON: "true"
    environment:
      APP_NAME: api-common

  # API du client : son module, plus common en solution 2
  api:
    <<: *api
    build:
      context: ./backend
      args:
        COMMON: "false"
        # Empreinte des sources du client, calculée par le Makefile : sans
        # elle, le cache de Compose ignore les modifications du client.
        CLIENT_REV: ${CLIENT_REV:-}
        # CLIENT et additional_contexts.client : fournis par cliN/compose-cliN.yaml
